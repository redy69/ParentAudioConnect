name: Inspect icon2 ZIP

on:
  push:
    branches:
      - ui/dark-emerald-glass-dashboard
    paths:
      - .github/workflows/inspect-icon2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard branch
        uses: actions/checkout@v4
        with:
          ref: ui/dark-emerald-glass-dashboard
          fetch-depth: 1

      - name: Install image inspection dependency
        run: python -m pip install --quiet Pillow


      - name: Verify and extract the supplied archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          archive = Path("screenshot/icon2.zip")
          assert archive.is_file(), f"Arsip tidak ditemukan: {archive}"
          source = Path("/tmp/icon2-unpacked")
          source.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError(f"Arsip rusak pada: {bad}")
              z.extractall(source)
          target = Path("screenshot/icon2-inspection")
          rows = []
          for p in sorted(source.rglob("*")):
              if not p.is_file():
                  continue
              rel = p.relative_to(source)
              dest = target / "extracted" / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, dest)
              rows.append(f"- `{rel.as_posix()}` — {p.stat().st_size} bytes")
          (target / "CONTENTS.md").write_text(
              "# Isi screenshot/icon2.zip\n\n" +
              ("\n".join(rows) if rows else "Tidak ada file di dalam arsip.") + "\n",
              encoding="utf-8"
          )
          print("\n".join(rows))
          PY

      - name: Create icon contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          files = [p for p in Path("screenshot/icon2-inspection/extracted").rglob("*")
                   if p.is_file() and p.suffix.lower() in {".png",".jpg",".jpeg",".webp",".gif",".bmp"}]
          if not files:
              raise SystemExit("Tidak ditemukan gambar ikon.")
          cell_w, cell_h, cols = 220, 190, 4
          rows = (len(files) + cols - 1) // cols
          sheet = Image.new("RGB", (cols*cell_w, rows*cell_h), "white")
          draw = ImageDraw.Draw(sheet)
          for i, p in enumerate(files):
              x, y = (i % cols)*cell_w, (i // cols)*cell_h
              try:
                  with Image.open(p) as im:
                      im.seek(0)
                      im = im.convert("RGBA")
                      im.thumbnail((150, 135))
                      tile = Image.new("RGBA", (160, 140), (245,245,245,255))
                      tile.alpha_composite(im, ((160-im.width)//2, (140-im.height)//2))
                      sheet.paste(tile.convert("RGB"), (x+30, y+4))
              except Exception:
                  draw.text((x+8,y+8), "Gagal membaca gambar", fill="red")
              draw.text((x+8, y+148), p.name[:30], fill="black")
              draw.text((x+8, y+165), str(p.relative_to("screenshot/icon2-inspection/extracted"))[:32], fill="black")
          sheet.save("screenshot/icon2-inspection/contact-sheet.jpg", quality=88)
          PY

      - name: Commit inspection folder only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshot/icon2-inspection
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan folder inspeksi."
          else
            git commit -m "Add extracted icon2 inspection folder"
            git push origin HEAD:ui/dark-emerald-glass-dashboard
          fi
