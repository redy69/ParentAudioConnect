name: Build SantetHP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-13-boot-reconnect
      - feature/remote-camera
      - fix/camera-standby-return-and-fcm
      - feature/device-health-monitoring
      - feature/livekit-multi-server-failover
      - recovery/full-features-2026-11-12
      - ui/liquid-glass-child-status
      - ui/dark-emerald-glass-dashboard
      - feature/gallery-turn-fallback

permissions:
  contents: write

concurrency:
  group: santethp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install custom SantetHP icon pack
        run: |
          mkdir -p "$RUNNER_TEMP/santethp-icons"
          curl -fL "https://raw.githubusercontent.com/redy69/ParentAudioConnect/b164ed1a75a7bece1e1a840b9ac5670055aca8d7/screenshot/icon.zip" -o "$RUNNER_TEMP/santethp-icons/icon.zip"
          unzip -q "$RUNNER_TEMP/santethp-icons/icon.zip" -d "$RUNNER_TEMP/santethp-icons"
          mkdir -p app/src/main/res/raw app/src/main/res/drawable-nodpi
          cp "$RUNNER_TEMP/santethp-icons/icon/Camera_live.gif" app/src/main/res/raw/camera_live_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/add.gif" app/src/main/res/raw/add_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/block_app.gif" app/src/main/res/raw/block_app_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/galeri.gif" app/src/main/res/raw/galeri_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/map-location.gif" app/src/main/res/raw/map_location_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/notification.gif" app/src/main/res/raw/notification_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/server.gif" app/src/main/res/raw/server_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/user.gif" app/src/main/res/raw/user_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/whatsapp.png" app/src/main/res/drawable-nodpi/whatsapp_icon.png
          cp "$RUNNER_TEMP/santethp-icons/icon/wifi.png" app/src/main/res/drawable-nodpi/wifi_icon.png
          curl -fL "https://raw.githubusercontent.com/redy69/ParentAudioConnect/49a6dc86eb92eed40871adfb77962d027fcb0294/screenshot/icon1.zip" -o "$RUNNER_TEMP/santethp-icons/icon1.zip"
          unzip -q "$RUNNER_TEMP/santethp-icons/icon1.zip" -d "$RUNNER_TEMP/santethp-icons"
          cp "$RUNNER_TEMP/santethp-icons/icon1/baterai.png" app/src/main/res/drawable-nodpi/battery_icon.png
          cp "$RUNNER_TEMP/santethp-icons/icon1/wifi-router.png" app/src/main/res/drawable-nodpi/wifi_icon.png
          cp "$RUNNER_TEMP/santethp-icons/icon1/signal.png" app/src/main/res/drawable-nodpi/signal_icon.png

      - name: Install supplied icon2 menu images
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/santethp-icon2" app/src/main/res/drawable-nodpi
          curl -fL "https://raw.githubusercontent.com/redy69/ParentAudioConnect/main/screenshot/icon2.zip" -o "$RUNNER_TEMP/santethp-icon2/icon2.zip"
          unzip -q "$RUNNER_TEMP/santethp-icon2/icon2.zip" -d "$RUNNER_TEMP/santethp-icon2"
          ICON_DIR="$RUNNER_TEMP/santethp-icon2/icon2"
          test -d "$ICON_DIR"
          cp "$ICON_DIR/add.png" app/src/main/res/drawable-nodpi/menu_add_icon.png
          cp "$ICON_DIR/audio.png" app/src/main/res/drawable-nodpi/menu_audio_icon.png
          cp "$ICON_DIR/blocked.png" app/src/main/res/drawable-nodpi/menu_blocked_icon.png
          cp "$ICON_DIR/boy.png" app/src/main/res/drawable-nodpi/menu_boy_icon.png
          cp "$ICON_DIR/camera.png" app/src/main/res/drawable-nodpi/menu_camera_icon.png
          cp "$ICON_DIR/galeri.png" app/src/main/res/drawable-nodpi/menu_gallery_icon.png
          cp "$ICON_DIR/map.png" app/src/main/res/drawable-nodpi/menu_map_icon.png
          cp "$ICON_DIR/mp3.png" app/src/main/res/drawable-nodpi/menu_mp3_icon.png
          cp "$ICON_DIR/server.png" app/src/main/res/drawable-nodpi/menu_server_icon.png
          cp "$ICON_DIR/whatsapp.png" app/src/main/res/drawable-nodpi/menu_whatsapp_icon.png
          echo "Installed all 10 supplied icon2 PNG assets."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parent-audio-release.jks"
          test -s "$RUNNER_TEMP/parent-audio-release.jks"

      - name: Build signed release APK
        env:
          METERED_TURN_API_KEY: ${{ secrets.METERED_TURN_API_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/parent-audio-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 5))
          echo "Building SantetHP with versionCode=$VERSION_CODE"
          gradle assembleRelease -PversionCode="$VERSION_CODE"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SantetHP Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-release
          path: app/build/outputs/apk/release/app-release.apk

# Triggered by a commit on this branch to produce the Gallery TURN fallback test APK.
