name: Build SantetHP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-13-boot-reconnect
      - feature/remote-camera
      - fix/camera-standby-return-and-fcm
      - feature/device-health-monitoring
      - feature/livekit-multi-server-failover
      - recovery/full-features-2026-11-12
      - ui/liquid-glass-child-status
      - ui/dark-emerald-glass-dashboard

permissions:
  contents: write

concurrency:
  group: santethp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install custom SantetHP icon pack
        run: |
          mkdir -p "$RUNNER_TEMP/santethp-icons"
          curl -fL "https://raw.githubusercontent.com/redy69/ParentAudioConnect/main/screenshot/icon.zip" -o "$RUNNER_TEMP/santethp-icons/icon.zip"
          unzip -q "$RUNNER_TEMP/santethp-icons/icon.zip" -d "$RUNNER_TEMP/santethp-icons"
          mkdir -p app/src/main/res/raw app/src/main/res/drawable-nodpi
          cp "$RUNNER_TEMP/santethp-icons/icon/Camera_live.gif" app/src/main/res/raw/camera_live_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/add.gif" app/src/main/res/raw/add_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/block_app.gif" app/src/main/res/raw/block_app_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/galeri.gif" app/src/main/res/raw/galeri_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/map-location.gif" app/src/main/res/raw/map_location_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/notification.gif" app/src/main/res/raw/notification_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/server.gif" app/src/main/res/raw/server_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/user.gif" app/src/main/res/raw/user_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/whatsapp.png" app/src/main/res/drawable-nodpi/whatsapp_icon.png
          cp "$RUNNER_TEMP/santethp-icons/icon/wifi.png" app/src/main/res/drawable-nodpi/wifi_icon.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parent-audio-release.jks"
          test -s "$RUNNER_TEMP/parent-audio-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/parent-audio-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 5))
          echo "Building SantetHP with versionCode=$VERSION_CODE"
          gradle assembleRelease -PversionCode="$VERSION_CODE"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SantetHP Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-release
          path: app/build/outputs/apk/release/app-release.apk

# Triggered by a commit on this branch to produce the LiveKit failover test APK.
