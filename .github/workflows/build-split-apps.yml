name: Build SantetHP split release (optimized ABI)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode for this release"
        required: true
        default: "720"
        type: string

permissions:
  contents: write

concurrency:
  group: santethp-split-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ParentAudioConnect workflow host
        uses: actions/checkout@v4

      - name: Clone optimized SantetHP source
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch optimization/apk-size-build-719 https://github.com/redy69/santet-child.git split-source

      - name: Validate version code
        env:
          VERSION_CODE: \${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code must contain digits only"
            exit 1
          fi
          if [ "$VERSION_CODE" -lt 720 ]; then
            echo "::error::version_code must be 720 or higher"
            exit 1
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Install SantetHP icon assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/santethp-icons"
          curl -fL "https://raw.githubusercontent.com/redy69/ParentAudioConnect/b164ed1a75a7bece1e1a840b9ac5670055aca8d7/screenshot/icon.zip" -o "$RUNNER_TEMP/santethp-icons/icon.zip"
          unzip -q "$RUNNER_TEMP/santethp-icons/icon.zip" -d "$RUNNER_TEMP/santethp-icons"
          mkdir -p split-source/app/src/main/res/raw split-source/app/src/main/res/drawable-nodpi
          cp "$RUNNER_TEMP/santethp-icons/icon/notification.gif" split-source/app/src/main/res/raw/notification_icon.gif
          cp "$RUNNER_TEMP/santethp-icons/icon/whatsapp.png" split-source/app/src/main/res/drawable-nodpi/whatsapp_icon.png
          cp "$RUNNER_TEMP/santethp-icons/icon/wifi.png" split-source/app/src/main/res/drawable-nodpi/wifi_icon.png
          curl -fL "https://raw.githubusercontent.com/redy69/ParentAudioConnect/49a6dc86eb92eed40871adfb77962d027fcb0294/screenshot/icon1.zip" -o "$RUNNER_TEMP/santethp-icons/icon1.zip"
          unzip -q "$RUNNER_TEMP/santethp-icons/icon1.zip" -d "$RUNNER_TEMP/santethp-icons"
          cp "$RUNNER_TEMP/santethp-icons/icon1/baterai.png" split-source/app/src/main/res/drawable-nodpi/battery_icon.png
          cp "$RUNNER_TEMP/santethp-icons/icon1/wifi-router.png" split-source/app/src/main/res/drawable-nodpi/wifi_icon.png
          cp "$RUNNER_TEMP/santethp-icons/icon1/signal.png" split-source/app/src/main/res/drawable-nodpi/signal_icon.png

      - name: Install icon2 menu images
        run: |
          set -euo pipefail
          ICON_DIR="split-source/screenshot/icon2-inspection/extracted/icon2"
          mkdir -p split-source/app/src/main/res/drawable-nodpi
          test -d "$ICON_DIR"
          cp "$ICON_DIR/add.png" split-source/app/src/main/res/drawable-nodpi/menu_add_icon.png
          cp "$ICON_DIR/audio.png" split-source/app/src/main/res/drawable-nodpi/menu_audio_icon.png
          cp "$ICON_DIR/blocked.png" split-source/app/src/main/res/drawable-nodpi/menu_blocked_icon.png
          cp "$ICON_DIR/boy.png" split-source/app/src/main/res/drawable-nodpi/menu_boy_icon.png
          cp "$ICON_DIR/camera.png" split-source/app/src/main/res/drawable-nodpi/menu_camera_icon.png
          cp "$ICON_DIR/galeri.png" split-source/app/src/main/res/drawable-nodpi/menu_gallery_icon.png
          cp "$ICON_DIR/map.png" split-source/app/src/main/res/drawable-nodpi/menu_map_icon.png
          cp "$ICON_DIR/mp3.png" split-source/app/src/main/res/drawable-nodpi/menu_mp3_icon.png
          cp "$ICON_DIR/server.png" split-source/app/src/main/res/drawable-nodpi/menu_server_icon.png
          cp "$ICON_DIR/whatsapp.png" split-source/app/src/main/res/drawable-nodpi/menu_whatsapp_icon.png

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test Firestore security rules
        working-directory: split-source
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx firebase emulators:exec --only firestore --project demo-santethp "npm run test:rules"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare permanent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: \${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/santethp-release.jks"
          test -s "$RUNNER_TEMP/santethp-release.jks"

      - name: Build signed minified Anak and Ortu APKs
        env:
          METERED_TURN_API_KEY: \${{ secrets.METERED_TURN_API_KEY }}
          ANDROID_KEYSTORE_PATH: \${{ runner.temp }}/santethp-release.jks
          ANDROID_KEYSTORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle -p split-source :app:assembleAnakRelease :app:assembleOrtuRelease -PversionCode="$VERSION_CODE"
          mkdir -p "$RUNNER_TEMP/santethp-optimized-release"
          cp split-source/app/build/outputs/apk/anak/release/app-anak-arm64-v8a-release.apk "$RUNNER_TEMP/santethp-optimized-release/santethp-anak-arm64-v8a.apk"
          cp split-source/app/build/outputs/apk/anak/release/app-anak-armeabi-v7a-release.apk "$RUNNER_TEMP/santethp-optimized-release/santethp-anak-armeabi-v7a.apk"
          cp split-source/app/build/outputs/apk/anak/release/app-anak-x86-release.apk "$RUNNER_TEMP/santethp-optimized-release/santethp-anak-x86.apk"
          cp split-source/app/build/outputs/apk/anak/release/app-anak-x86_64-release.apk "$RUNNER_TEMP/santethp-optimized-release/santethp-anak-x86_64.apk"
          cp split-source/app/build/outputs/apk/anak/release/app-anak-universal-release.apk "$RUNNER_TEMP/santethp-optimized-release/santethp-anak-universal.apk"
          cp split-source/app/build/outputs/apk/ortu/release/app-ortu-arm64-v8a-release.apk "$RUNNER_TEMP/santethp-optimized-release/santethp-ortu-arm64-v8a.apk"
          cp split-source/app/build/outputs/apk/ortu/release/app-ortu-armeabi-v7a-release.apk "$RUNNER_TEMP/santethp-optimized-release/santethp-ortu-armeabi-v7a.apk"
          cp split-source/app/build/outputs/apk/ortu/release/app-ortu-x86-release.apk "$RUNNER_TEMP/santethp-optimized-release/santethp-ortu-x86.apk"
          cp split-source/app/build/outputs/apk/ortu/release/app-ortu-x86_64-release.apk "$RUNNER_TEMP/santethp-optimized-release/santethp-ortu-x86_64.apk"
          cp split-source/app/build/outputs/apk/ortu/release/app-ortu-universal-release.apk "$RUNNER_TEMP/santethp-optimized-release/santethp-ortu-universal.apk"
          test "$(find "$RUNNER_TEMP/santethp-optimized-release" -maxdepth 1 -name '*.apk' | wc -l)" -eq 10
          echo "APK file sizes:"
          du -b "$RUNNER_TEMP"/santethp-optimized-release/*.apk
          sha256sum "$RUNNER_TEMP"/santethp-optimized-release/*.apk
          cd "$RUNNER_TEMP/santethp-optimized-release"
          zip -q "SantetHP-Ortu-Anak-ABI-v\${VERSION_CODE}.zip" ./*.apk

      - name: Add Android build-tools to PATH
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Verify official release certificate on all APKs
        run: |
          set -euo pipefail
          expected="9e6b4eb435fc2b6e62b952776525dd037982f2c6"
          count=0
          for apk in "$RUNNER_TEMP"/santethp-optimized-release/*.apk; do
            output="$(apksigner verify --print-certs "$apk")"
            actual="$(printf '%s\n' "$output" | awk -F': ' '/certificate SHA-1 digest:/ {print tolower($2); exit}' | tr -d ':')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Unexpected signing certificate for $(basename "$apk"): $actual"
              exit 1
            fi
            echo "Verified official certificate: $(basename "$apk")"
            count=$((count + 1))
          done
          test "$count" -eq 10

      - name: Upload all APKs and ZIP as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SantetHP-Ortu-Anak-ABI-v\${{ env.VERSION_CODE }}
          path: |
            \${{ runner.temp }}/santethp-optimized-release/*.apk
            \${{ runner.temp }}/santethp-optimized-release/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub Release with all APK variants
        uses: softprops/action-gh-release@v2
        with:
          tag_name: split-build-v\${{ env.VERSION_CODE }}
          name: SantetHP Ortu & Anak Build \${{ env.VERSION_CODE }}
          draft: true
          prerelease: false
          files: |
            \${{ runner.temp }}/santethp-optimized-release/*.apk
            \${{ runner.temp }}/santethp-optimized-release/*.zip
          generate_release_notes: true
