name: Read release SHA-1 fingerprint

on:
  push:
    branches:
      - feature/gallery-webrtc-p2p
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Decode existing release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parent-audio-release.jks"
          test -s "$RUNNER_TEMP/parent-audio-release.jks"

      - name: Print SHA-1 fingerprint only
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          keytool -list -v \
            -keystore "$RUNNER_TEMP/parent-audio-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" |
            awk -F': ' '/SHA1:/{print "Release SHA-1: " $2; found=1} END{if (!found) exit 1}'
